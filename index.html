<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中小ナムジャドル好き顔9選</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px 12px 40px}
h1{font-size:22px;text-align:center;margin:6px 0 4px;font-weight:800}
.sub{text-align:center;color:#777;font-size:13px;margin-bottom:14px}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:10px 0 12px}
.status{text-align:center;font-weight:700;margin-bottom:8px}
button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer}
#make{background:#111;color:#fff}
#make:disabled{background:#ddd;color:#888;cursor:not-allowed}
#reset{background:#f1f1f1;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#f3f3f3;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card.selected{border-color:#111}
.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee}
.name{font-size:12px;font-weight:800;padding:6px 5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group{font-size:10px;color:#777;padding:2px 5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{position:absolute;left:6px;top:6px;width:30px;height:30px;border-radius:50%;background:#111;color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;font-weight:900;box-shadow:0 2px 7px #0004}
.card.selected .num{display:flex}
.result{display:none;margin-top:22px}
.result.show{display:block}
.result h2{text-align:center;font-size:18px;margin:0 0 10px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#111;padding:4px}
.result-item{background:#fff;position:relative}
.result-item img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.result-label{position:absolute;left:5px;top:5px;background:#111;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.result-caption{font-size:11px;font-weight:800;padding:5px;line-height:1.2}
.note{text-align:center;color:#888;font-size:11px;margin-top:14px;line-height:1.5}
@media (min-width:600px){.grid{gap:10px}.card img{aspect-ratio:1/1}}
</style>
</head>
<body>
<div class="wrap">
  <h1>中小ナムジャドル好き顔9選</h1>
  <div class="sub">好きな顔を9人選んでね ♡</div>

  <div class="toolbar">
    <div class="status" id="status">0 / 9 選択中</div>
    <div style="text-align:center">
      <button id="make" disabled>9選を作る</button>
      <button id="reset">リセット</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <section class="result" id="result">
    <h2>あなたの好き顔9選 ♡</h2>
    <div class="result-grid" id="resultGrid"></div>
    <div style="text-align:center;margin-top:12px">
      <button id="back">選び直す</button>
    </div>
  </section>

  <div class="note">写真は公開されているK-POPプロフィール画像を参照しています。画像表示にはインターネット接続が必要です。</div>
</div>

<script>
const members = [{"name": "ジェイミン", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/J-Min/profile.webp"}, {"name": "ハンギョル", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/Hangyul/profile.webp"}, {"name": "ユジュン", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/Yoojun2/profile.webp"}, {"name": "ムジン", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/Muzin/profile.webp"}, {"name": "ジュンソ", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/Junseo/profile.webp"}, {"name": "ヨンソ", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/Youngseo2/profile.webp"}, {"name": "ビッ", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/Bit/profile.webp"}, {"name": "ドハ", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/Doha/profile.webp"}, {"name": "ドヒョン", "group": "BAE173", "img": "https://cdn.kpopping.com/idols/Dohyon/profile.webp"}, {"name": "ソンミン", "group": "ONE PACT", "img": "https://cdn.kpopping.com/idols/Seongmin2/profile.webp"}, {"name": "ジョンウ", "group": "ONE PACT", "img": "https://cdn.kpopping.com/idols/Jongwoo/profile.webp"}, {"name": "ジェイ", "group": "ONE PACT", "img": "https://cdn.kpopping.com/idols/Jay-Chang/profile.webp"}, {"name": "イェダム", "group": "ONE PACT", "img": "https://cdn.kpopping.com/idols/Yedam/profile.webp"}, {"name": "テグ", "group": "ONE PACT", "img": "https://cdn.kpopping.com/idols/Tag2/profile.webp"}, {"name": "ミンジェ", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Minjae/profile.webp"}, {"name": "ジュンミン", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Junmin/profile.webp"}, {"name": "スミン", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Sumin9/profile.webp"}, {"name": "ジンシク", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Jinsik/profile.webp"}, {"name": "ヒョヌ", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Hyunwoo4/profile.webp"}, {"name": "ジョンフン", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Junghoon/profile.webp"}, {"name": "セウン", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Seeun/profile.webp"}, {"name": "ユジュン", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Yujun2/profile.webp"}, {"name": "ハンター", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Hunter/profile.webp"}, {"name": "イェチャン", "group": "xikers", "img": "https://cdn.kpopping.com/idols/Yechan/profile.webp"}];
const selected = [];

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

const grid=document.getElementById('grid');
const status=document.getElementById('status');
const make=document.getElementById('make');
const result=document.getElementById('result');
const resultGrid=document.getElementById('resultGrid');

function render(){
  grid.innerHTML='';
  shuffle(members).forEach((m,idx)=>{
    const card=document.createElement('div');
    card.className='card';
    card.dataset.idx=idx;
    const order=selected.indexOf(m);
    card.innerHTML=`<div class="num">${order>=0?order+1:''}</div>
      <img loading="lazy" src="${m.img}" alt="${m.name}（${m.group}）"
           onerror="this.style.background='#ddd';this.removeAttribute('src');">
      <div class="name">${m.name}</div><div class="group">${m.group}</div>`;
    card.onclick=()=>toggle(m);
    if(order>=0) card.classList.add('selected');
    grid.appendChild(card);
  });
  update();
}

function toggle(m){
  const i=selected.indexOf(m);
  if(i>=0){
    selected.splice(i,1);
  }else{
    if(selected.length>=9) return;
    selected.push(m);
  }
  render();
}

function update(){
  status.textContent=`${selected.length} / 9 選択中`;
  make.disabled=selected.length!==9;
}

make.onclick=()=>{
  if(selected.length!==9) return;
  resultGrid.innerHTML=selected.map((m,i)=>`
    <div class="result-item">
      <img src="${m.img}" alt="${m.name}">
      <div class="result-label">${i+1}</div>
      <div class="result-caption">${m.name}<br><span style="color:#777;font-weight:600">${m.group}</span></div>
    </div>`).join('');
  grid.style.display='none';
  document.querySelector('.toolbar').style.display='none';
  result.classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
};

function reset(){
  selected.length=0;
  result.classList.remove('show');
  grid.style.display='grid';
  document.querySelector('.toolbar').style.display='block';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('reset').onclick=reset;
document.getElementById('back').onclick=reset;

render();
</script>
</body>
</html>
